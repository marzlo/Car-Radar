name: 每日更新

on:
  schedule:
    # GitHub 的排程在整點最擁擠，常延遲好幾個小時，所以避開整點並排兩次：
    - cron: "23 20 * * *"     # UTC 20:23 = 台灣時間 04:23（通常 6 點前跑完）
    - cron: "41 23 * * *"     # UTC 23:41 = 台灣時間 07:41（補跑，確保早上一定有更新）
  workflow_dispatch:           # 可以在 Actions 頁面手動按 Run workflow
  push:
    branches: [main]           # 你改議題或交車量後 push，會重建並部署

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: car-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 更新資料
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/update_all.py build_issues fetch_stocks fetch_financials fetch_market fetch_news
          else
            python scripts/update_all.py
          fi

      - name: 把新資料 commit 回 repo
        run: |
          git config user.name  "car-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "data: 自動更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi

      - name: 加上版本號，避免瀏覽器用到舊的 CSS／JS
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
