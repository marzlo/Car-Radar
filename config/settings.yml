# 新聞來源（RSS）
feeds:
  - {name: Google 新聞（電動車）, url: "https://news.google.com/rss/search?q=%E9%9B%BB%E5%8B%95%E8%BB%8A+when:1d&hl=zh-TW&gl=TW&ceid=TW:zh-Hant", lang: zh}
  - {name: Google 新聞（智駕）,   url: "https://news.google.com/rss/search?q=%E6%99%BA%E9%A7%95+OR+%E8%87%AA%E5%8B%95%E9%A7%95%E9%A7%9B+when:1d&hl=zh-TW&gl=TW&ceid=TW:zh-Hant", lang: zh}
  - {name: Google 新聞（汽車產業）, url: "https://news.google.com/rss/search?q=%E6%B1%BD%E8%BB%8A%E7%94%A2%E6%A5%AD+when:1d&hl=zh-TW&gl=TW&ceid=TW:zh-Hant", lang: zh}
  - {name: Google News (EV),      url: "https://news.google.com/rss/search?q=electric+vehicle+automaker+when:1d&hl=en-US&gl=US&ceid=US:en", lang: en}
  - {name: Google 新聞（Stellantis）, url: "https://news.google.com/rss/search?q=Stellantis+OR+%E6%96%AF%E6%B3%B0%E8%98%AD%E8%92%82%E6%96%AF+OR+Jeep+OR+%E9%9B%AA%E9%90%B5%E9%BE%8D+when:1d&hl=zh-TW&gl=TW&ceid=TW:zh-Hant", lang: zh}
  - {name: Google News (Stellantis), url: "https://news.google.com/rss/search?q=Stellantis+when:1d&hl=en-US&gl=US&ceid=US:en", lang: en}
  - {name: Google News (Stellantis brands), url: "https://news.google.com/rss/search?q=Jeep+OR+%22Ram+trucks%22+OR+Peugeot+OR+Fiat+OR+Chrysler+OR+Maserati+automaker+when:1d&hl=en-US&gl=US&ceid=US:en", lang: en}
  - {name: Electrek,              url: "https://electrek.co/feed/", lang: en}
  - {name: InsideEVs,             url: "https://insideevs.com/rss/news/all/", lang: en}
  - {name: CnEVPost,              url: "https://cnevpost.com/feed/", lang: en}

news:
  keep_days: 7          # 首頁保留最近幾天的新聞
  max_per_feed: 25
  # 所有新聞都要含 relevance 裡的字或車企名稱才會留下。
  # 下面這些名稱不只代表汽車（手機、晶片、代工，或一般用語），單獨出現不算「跟汽車有關」
  ambiguous: [小米, Xiaomi, 華為, Huawei, 鴻海, Foxconn, 理想, 上市, 發表, launch]
  # 標題含這些字的直接丟掉（市調公司的業配稿）
  block: ["Market Size", "Market Report", "Market Share Analysis", "CAGR", "Mordor Intelligence", "openPR", "Market to Reach", "Market Forecast"]

# AI（需要在 GitHub Secrets 設定 ANTHROPIC_API_KEY；沒設定時自動略過）
ai:
  model: claude-sonnet-5-5
  web_search_tool: web_search_20250305
